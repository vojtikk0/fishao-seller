# Test Mac verze na skutečném Macu: Apple Vision, Quartz, build .app + selftest.
name: Test macOS

on:
  push:
    branches: ["**"]
    paths: ["mac/**", "tests/screens/**", ".github/workflows/test-mac.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m pip install -r mac/requirements.txt
      - name: macOS info
        run: sw_vers && system_profiler SPDisplaysDataType | grep -E "Resolution|Retina" || true
      - name: Test on real macOS APIs
        run: python3 mac/tests/test_mac_real.py --out test-out
      - name: Build .app
        if: always()
        run: bash mac/build_mac.sh
      - name: Selftest of the built app
        if: always()
        run: '"mac/dist/Fishao Seller.app/Contents/MacOS/Fishao Seller" --selftest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-test-output
          path: |
            test-out/
            mac/dist/FishaoSeller-mac.zip
